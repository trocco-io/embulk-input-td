plugins {
    id "java"
    id "maven-publish"
    id "com.github.johnrengelman.shadow"
}

repositories {
    mavenCentral()
}

group = "${rootProject.group}"
version = "${rootProject.version}"

sourceCompatibility = 1.8
targetCompatibility = 1.8

configurations {
    runtimeClasspath {
        resolutionStrategy.activateDependencyLocking()
    }
    shadow {
        resolutionStrategy.activateDependencyLocking()
        transitive = false
    }
}

dependencies {
//    implementation "com.treasuredata.client:td-client:1.1.3"

    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    implementation "com.google.guava:guava:31.1-jre"
    implementation "com.fasterxml.jackson.core:jackson-core:2.14.2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.14.2"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.14.2"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.14.2"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-json-org:2.14.2"
    implementation "org.slf4j:slf4j-api:2.0.12"
    annotationProcessor "org.immutables:value:2.10.1"
    compileOnly "org.immutables:value:2.10.1"
    compileOnly "org.immutables:builder:2.10.1"
}

shadowJar {
    relocate "com.fasterxml.jackson.annotation", "embulk.td.com.fasterxml.jackson.annotation"
    relocate "com.fasterxml.jackson.core", "embulk.td.com.fasterxml.jackson.core"
    relocate "com.fasterxml.jackson.databind", "embulk.td.com.fasterxml.jackson.databind"
    relocate "com.fasterxml.jackson.datatype.guava", "embulk.td.com.fasterxml.jackson.datatype.guava"
    relocate "com.fasterxml.jackson.datatype.jdk8", "embulk.td.com.fasterxml.jackson.datatype.jdk8"
    relocate "com.fasterxml.jackson.datatype.joda", "embulk.td.com.fasterxml.jackson.datatype.joda"
}
